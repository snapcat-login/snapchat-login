<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Log In • Fake Demo App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      background-color: #f3f3f3;
      margin: 0; padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      padding: 40px 32px 32px;
      width: 340px;
      text-align: center;
    }

    /* ── Fake logo badge ── */
    .fake-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 18px;
    }
    .fake-logo-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: repeating-linear-gradient(
        45deg,
        #fff152,
        #fff152 8px,
        #111 8px,
        #111 16px
      );
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      border: 2px solid #111;
    }
    .fake-logo-icon span {
      background: #fff;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #111;
      transform: rotate(-8deg);
    }
    .fake-logo-text {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #b3860b;
      background: #fff8e1;
      border: 1px solid #f1d78c;
      padding: 3px 10px;
      border-radius: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #111;
      margin: 0 0 20px;
    }

    .identity-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #e2e2e2;
      border-radius: 24px;
      padding: 8px 16px;
      font-size: 13px;
      color: #333;
      margin-bottom: 20px;
    }
    .identity-pill button {
      background: none;
      border: none;
      color: #1a8fe3;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
    }

    label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }
    .password-container { position: relative; }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 40px 12px 14px;
      border: 1px solid #dcdcdc;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 4px;
    }
    input:focus {
      outline: none;
      border-color: #1a8fe3;
      box-shadow: 0 0 0 3px rgba(26,143,227,0.12);
    }
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      color: #888;
    }

    .server-message {
      display: none;
      padding: 10px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 13px;
      text-align: left;
    }
    .server-message.error {
      display: block;
      background-color: #fff0f0;
      color: #cc0000;
      border: 1px solid #f5c6c6;
    }
    .server-message.success {
      display: block;
      background-color: #f0fff4;
      color: #007a33;
      border: 1px solid #b2dfcc;
    }

    .forgot {
      display: block;
      font-size: 13px;
      color: #1a8fe3;
      text-decoration: none;
      margin: 14px 0 20px;
      font-weight: 600;
    }

    .login-button {
      width: 100%;
      padding: 13px;
      background-color: #1a8fe3;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .login-button:hover { background-color: #1478c2; }
    .login-button:disabled { background-color: #a7abad; cursor: default; }

    .hint {
      font-size: 11px;
      color: #999;
      margin-top: 14px;
      line-height: 1.4;
    }

    .signup-row {
      margin-top: 20px;
      font-size: 14px;
      color: #333;
    }
    .signup-row a {
      color: #1a8fe3;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="fake-logo">
      <div class="fake-logo-icon"><span>FAKE</span></div>
      <div class="fake-logo-text">Not a real app — school demo</div>
    </div>

    <h1>Enter Password</h1>

    <div class="identity-pill">
      <span id="identity-display">you@example.com</span>
      <button type="button" id="not-you-btn">Not you?</button>
    </div>

    <form onsubmit="return handleLogin(event)">

      <label for="username" style="display:none">USERNAME OR EMAIL</label>
      <input type="text" id="username" name="name" required style="display:none">

      <label for="password">Password</label>
      <div class="password-container">
        <input type="password" id="password" name="message" required>
        <button type="button" class="toggle-password" id="toggle-password">Show</button>
      </div>

      <div id="server-message" class="server-message"></div>

      <a href="javascript:void(0);" class="forgot">Forgot Password</a>

      <button type="submit" class="login-button" id="login-btn">Log In</button>

      <p class="hint">First time using this email? Logging in creates a demo account with whatever you type. No real accounts exist here.</p>

    </form>

  </div>

  <p class="signup-row">New here? <a href="javascript:void(0);">Sign Up</a></p>

  <script>
    // Same server serves both the page and the API.
    const SERVER_URL = '';

    const usernameInput   = document.getElementById('username');
    const identityDisplay = document.getElementById('identity-display');
    const notYouBtn       = document.getElementById('not-you-btn');

    // On first load, prompt for an identity via a simple inline flow.
    window.addEventListener('DOMContentLoaded', () => {
      const entered = promptForIdentity();
      usernameInput.value = entered;
      identityDisplay.textContent = entered || 'you@example.com';
    });

    function promptForIdentity() {
      const val = window.prompt('Enter a username or email (can be totally made up):', '');
      return (val || '').trim();
    }

    notYouBtn.addEventListener('click', () => {
      const entered = promptForIdentity();
      usernameInput.value = entered;
      identityDisplay.textContent = entered || 'you@example.com';
    });

    async function handleLogin(event) {
      event.preventDefault();

      const usernameOrEmail = usernameInput.value.trim();
      const password         = document.getElementById('password').value;
      const serverMsg        = document.getElementById('server-message');
      const loginBtn          = document.getElementById('login-btn');

      serverMsg.className   = 'server-message';
      serverMsg.textContent = '';

      if (!usernameOrEmail) {
        serverMsg.className   = 'server-message error';
        serverMsg.textContent = 'Please enter a username or email first (click "Not you?" to set one).';
        return false;
      }

      if (password.length < 8) {
        serverMsg.className   = 'server-message error';
        serverMsg.textContent = 'Password must be at least 8 characters.';
        return false;
      }

      loginBtn.textContent = 'Logging in…';
      loginBtn.disabled    = true;

      try {
        const res  = await fetch(`${SERVER_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: usernameOrEmail, password })
        });
        const data = await res.json();

        if (res.ok) {
          serverMsg.className   = 'server-message success';
          serverMsg.textContent = data.isNewAccount
            ? 'Demo account created and logged in!'
            : 'Login successful!';
        } else {
          serverMsg.className   = 'server-message error';
          serverMsg.textContent = data.error || 'Login failed. Please try again.';
        }
      } catch (err) {
        serverMsg.className   = 'server-message error';
        serverMsg.textContent = 'Could not reach the server. Please try again.';
      }

      loginBtn.textContent = 'Log In';
      loginBtn.disabled    = false;
      return false;
    }

    document.getElementById('toggle-password').addEventListener('click', function () {
      const passwordField = document.getElementById('password');
      if (passwordField.type === 'password') {
        passwordField.type = 'text';
        this.textContent = 'Hide';
      } else {
        passwordField.type = 'password';
        this.textContent = 'Show';
      }
    });
  </script>

</body>
</html>
